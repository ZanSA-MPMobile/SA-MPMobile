<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zan SA-MP Mobile</title>
<style>
:root {
  --blue:#0a84ff; --blue-press:#0071e3; --text:#f5f5f7; --muted:#98989f;
  --win:rgba(30,30,32,.82); --row:rgba(255,255,255,.06); --sep:rgba(255,255,255,.1);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html { scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; margin:0; }
body {
  min-height:100vh; color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.45;
  background:#030816;
  display:flex; align-items:center; justify-content:center; padding:28px 16px;
}
.wall { position:fixed; inset:0; width:100%; height:100%; z-index:-1; display:block; }
.win {
  width:100%; max-width:460px; background:var(--win); border:1px solid rgba(255,255,255,.12);
  border-radius:12px; overflow:hidden;
  -webkit-backdrop-filter:blur(30px) saturate(160%); backdrop-filter:blur(30px) saturate(160%);
  box-shadow:0 24px 60px rgba(0,0,0,.55);
}
.title { display:flex; align-items:center; height:44px; padding:0 14px; position:relative; border-bottom:1px solid var(--sep); }
.lights { display:flex; gap:8px; }
.lights i { width:12px; height:12px; border-radius:50%; display:block; }
.lights i:nth-child(1) { background:#ff5f57 } .lights i:nth-child(2){ background:#febc2e } .lights i:nth-child(3){ background:#28c840 }
.title span { position:absolute; left:0; right:0; text-align:center; font-size:.85rem; font-weight:600; color:var(--muted); pointer-events:none; }
.content { padding:32px 24px 28px; text-align:center; }
.icon {
  width:96px; height:96px; margin:0 auto 18px; border-radius:12%; display:block;
  box-shadow:0 8px 20px rgba(0,0,0,.45);
}
h1 { font-size:1.6rem; font-weight:700; letter-spacing:-.02em; }
.sub { color:var(--muted); margin-top:4px; }
.dl {
  display:inline-block; margin-top:22px; padding:9px 28px; background:var(--blue); color:#fff;
  text-decoration:none; font-weight:600; border-radius:999px; transition:background .15s;
}
.dl:hover { background:var(--blue-press); }
.group { margin-top:30px; background:var(--row); border-radius:10px; text-align:left; overflow:hidden; }
.group a {
  display:flex; align-items:center; justify-content:space-between; padding:12px 16px; color:var(--text);
  text-decoration:none; transition:background .12s;
}
.group a + a { border-top:1px solid var(--sep); }
.group a:hover { background:rgba(255,255,255,.07); }
.group a::after { content:"\203A"; color:var(--muted); font-size:1.3rem; line-height:1; }
a:focus-visible { outline:2px solid var(--blue); outline-offset:-2px; }
@media (prefers-color-scheme:light) { :root{ } }
</style>
</head>
